<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcadia Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'acd-background': '#000000',
                        'acd-surface': '#0a0a0a',
                        'acd-cta': '#3C72A8',
                        'acd-muted': '#ADADAD',
                    },
                    fontFamily: {
                        headline: ['Poppins', 'sans-serif'],
                        body: ['Montserrat', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .light-mode-active {
            filter: invert(1) hue-rotate(180deg);
            background-color: #ffffff;
        }

        .light-mode-active img, 
        .light-mode-active .no-invert {
            filter: invert(1) hue-rotate(180deg);
        }

        .calendar-day { aspect-ratio: 1/1; }
        .particle { position: fixed; width: 2px; height: 2px; background: rgba(255, 255, 255, 0.15); border-radius: 50%; pointer-events: none; }
        
        .svg-external-loader {
            animation: slowRotate 4s linear infinite;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes burstFade {
            0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0px); opacity: 1; }
            100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(70px); opacity: 0; }
        }
    </style>
</head>
<body class="bg-acd-background text-white font-body transition-all duration-500 overflow-x-hidden">

    <div id="splashScreen" class="fixed inset-0 bg-acd-background z-[9999] flex flex-col justify-center items-center transition-opacity duration-700">
        <div class="relative w-48 h-48 flex items-center justify-center">
            <img src="loader.svg" alt="Loading..." class="svg-external-loader w-full h-full object-contain" />
            
            <img src="logo.png" class="absolute w-20 h-20 rounded-full" alt="Logo center" />
        </div>
        <div class="mt-8 font-headline tracking-[0.4em] text-acd-cta text-xs uppercase animate-pulse">ARCADIAN PROPERTY</div>
    </div>

    <div id="particles" class="fixed inset-0 pointer-events-none"></div>

    <button id="modeToggle" class="fixed bottom-5 right-5 bg-acd-surface border border-acd-cta text-white px-5 py-2 rounded-sm z-50 font-headline text-sm uppercase no-invert">
        Light Mode
    </button>

    <div id="mainContent" class="opacity-0 transition-opacity duration-1000 pt-12">
        <div class="max-w-4xl mx-auto px-5 text-center">
            
            <header class="mb-12">
                <div class="relative inline-block">
                    <img id="arcadiaLogo" src="logo.png" alt="Logo" class="w-32 h-32 rounded-full border-2 border-acd-cta mb-5 mx-auto cursor-pointer transition-transform hover:scale-105" />
                </div>
                <h1 class="font-headline font-bold text-4xl md:text-6xl text-[#E0E0E0] tracking-widest uppercase mb-2">Timeline Arcadia</h1>
                <p class="font-headline text-acd-muted text-lg">Waktu Universal Arcadia Saat Ini:</p>
            </header>

            <section class="bg-acd-surface border border-white/10 p-10 rounded-lg mb-14 shadow-2xl">
                <div id="acdDate" class="text-2xl text-acd-cta font-bold mb-2">Memuat Tanggal...</div>
                <div id="acdTime" class="text-5xl md:text-7xl font-bold tracking-widest font-headline">00:00:00</div>
            </section>

            <section class="bg-acd-surface rounded-lg overflow-hidden border border-white/10 mb-20">
                <div class="p-8 border-b border-white/10">
                    <h3 id="monthYear" class="font-headline text-3xl mb-5">Kalender Arcadia</h3>
                    <div class="flex justify-center gap-4">
                        <button onclick="changeMonth(-1)" class="border border-acd-cta px-4 py-2 text-xs uppercase hover:bg-acd-cta transition-all">← Bulan Lalu</button>
                        <button onclick="resetToToday()" class="border border-acd-cta px-4 py-2 text-xs uppercase hover:bg-acd-cta transition-all">Bulan Ini</button>
                        <button onclick="changeMonth(1)" class="border border-acd-cta px-4 py-2 text-xs uppercase hover:bg-acd-cta transition-all">Bulan Depan →</button>
                    </div>
                </div>
                <div class="p-8">
                    <div id="dayHeaders" class="grid grid-cols-7 gap-2 mb-4"></div>
                    <div id="calendar" class="grid grid-cols-7 gap-2"></div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const acdEpoch = new Date('2025-10-27T00:00:00+07:00');
        const acdDayInRlSeconds = 1680; 
        const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const namaHari = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"];

        let currentACD = { year: 0, month: 0, day: 0 };
        let viewingMonth = 0;
        let viewingYear = 0;

        const pad = (n) => String(Math.floor(n)).padStart(2, '0');

        function calculateTime() {
            const now = new Date();
            const totalRealSecondsElapsed = (now.getTime() - acdEpoch.getTime()) / 1000;
            const acdMinuteInRlSeconds = acdDayInRlSeconds / 1440;
            const totalAcdSeconds = totalRealSecondsElapsed / acdMinuteInRlSeconds * 60;
            
            const totalAcdDays = Math.floor(totalAcdSeconds / (24 * 60 * 60));
            const acdYears = Math.floor(totalAcdDays / 360);
            const remainingDays = totalAcdDays % 360;
            
            currentACD.year = 1921 + acdYears;
            currentACD.month = Math.floor(remainingDays / 30) + 1;
            currentACD.day = (remainingDays % 30) + 1;

            if (viewingMonth === 0) {
                viewingMonth = currentACD.month;
                viewingYear = currentACD.year;
            }

            const secondsInDay = totalAcdSeconds % (24 * 60 * 60);
            const hour = Math.floor(secondsInDay / 3600);
            const minute = Math.floor((secondsInDay % 3600) / 60);
            const second = Math.floor(secondsInDay % 60);

            $('#acdDate').text(`${pad(currentACD.day)}/${pad(currentACD.month)}/${currentACD.year} ACD`);
            $('#acdTime').text(`${pad(hour)}:${pad(minute)}:${pad(second)}`);
            
            renderCalendar();
            requestAnimationFrame(calculateTime);
        }

        function renderCalendar() {
            const $grid = $('#calendar').empty();
            const $headers = $('#dayHeaders').empty();

            namaHari.forEach(h => {
                $('<div class="text-acd-cta font-bold text-sm pb-4">').text(h).appendTo($headers);
            });

            $('#monthYear').text(`${namaBulan[(viewingMonth - 1) % 12]}, Tahun ${viewingYear} ACD`);

            for (let i = 1; i <= 30; i++) {
                const isToday = (i === currentACD.day && viewingMonth === currentACD.month && viewingYear === currentACD.year);
                const $day = $('<div>')
                    .addClass('calendar-day flex items-center justify-center border border-white/5 cursor-pointer transition-all hover:bg-acd-cta')
                    .text(i);

                if (isToday) {
                    $day.addClass('bg-acd-cta font-bold shadow-[0_0_15px_rgba(60,114,168,0.5)]');
                }
                $grid.append($day);
            }
        }

        window.changeMonth = (dir) => {
            viewingMonth += dir;
            if (viewingMonth > 12) { viewingMonth = 1; viewingYear++; }
            else if (viewingMonth < 1) { viewingMonth = 12; viewingYear--; }
        };

        window.resetToToday = () => {
            viewingMonth = currentACD.month;
            viewingYear = currentACD.year;
        };

        $(document).ready(function() {
            setTimeout(() => {
                $('#mainContent').removeClass('opacity-0').addClass('opacity-100');
                $('#splashScreen').addClass('opacity-0');
                setTimeout(() => $('#splashScreen').hide(), 700);
            }, 3000);

            for(let i=0; i<70; i++) {
                $('<div class="particle">').css({
                    left: Math.random() * 100 + '%',
                    top: Math.random() * 100 + '%',
                    animation: `slowRotate ${5 + Math.random() * 5}s linear infinite`
                }).appendTo('#particles');
            }

            $('#modeToggle').on('click', function() {
                const isLight = $('html').toggleClass('light-mode-active').hasClass('light-mode-active');
                $(this).text(isLight ? 'Dark Mode' : 'Light Mode');
            });

            $('#arcadiaLogo').on('click', function(e) {
                for (let i = 0; i < 18; i++) {
                    $('<div class="absolute w-1 h-1 bg-acd-cta rounded-full pointer-events-none">')
                        .css({
                            left: '50%', top: '50%',
                            '--angle': `${i * 20}deg`,
                            animation: 'burstFade 0.8s ease-out forwards'
                        })
                        .appendTo($(this).parent())
                        .on('animationend', function() { $(this).remove(); });
                }
            });

            calculateTime();
        });
    </script>
</body>
</html>
