<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#3C72A8" stroke-width="2" stroke-opacity="0.2" />
    
    <circle cx="50" cy="50" r="45" fill="none" stroke="#3C72A8" stroke-width="4" stroke-linecap="round" stroke-dasharray="70 180">
        <animateTransform 
            attributeName="transform" 
            type="rotate" 
            from="0 50 50" 
            to="360 50 50" 
            dur="1.5s" 
            repeatCount="indefinite" />
    </circle>
    
    <circle cx="50" cy="50" r="35" fill="none" stroke="#ADADAD" stroke-width="1" stroke-dasharray="5 15">
        <animateTransform 
            attributeName="transform" 
            type="rotate" 
            from="360 50 50" 
            to="0 50 50" 
            dur="3s" 
            repeatCount="indefinite" />
    </circle>
</svg>